name: ci

# On every PR: type + i18n-parity check, build, and the Playwright E2E/visual/a11y
# suite on the official pinned container; then (only if Vercel secrets are present)
# a preview deploy whose provisional URL is posted back to the PR for validation.
# Production is NOT deployed here — that is gated on release-please (release-please.yml).

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-check, i18n parity and build on Node 24.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  # E2E + SEO + a11y + computed-style on the pinned Playwright container so the
  # baselines/render are deterministic (plan §5.4). Runs before any preview deploy.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Vercel preview deploy — the provisional URL for validation (RN-15). Gated on
  # verify + e2e, and skipped when Vercel secrets are not yet configured.
  preview:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the preview URL on the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Check Vercel secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Pinned CLI installed outside the project lockfile: its transitive tree would trip the
      # required dependency-review check. Exact version + --ignore-scripts, no on-demand npx.
      - name: Install Vercel CLI
        if: ${{ steps.guard.outputs.ready == 'true' }}
        run: npm install --global --ignore-scripts vercel@62.2.0
      - name: Deploy preview to Vercel
        id: deploy
        if: ${{ steps.guard.outputs.ready == 'true' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post preview URL to job summary
        if: ${{ steps.guard.outputs.ready == 'true' && steps.deploy.outputs.url != '' }}
        run: |
          echo "## Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL
        if: ${{ steps.guard.outputs.ready == 'true' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `🔎 **Vercel preview** (provisional URL for validation):\n\n${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mark = '🔎 **Vercel preview**';
            const existing = comments.find((c) => c.body && c.body.startsWith(mark));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
