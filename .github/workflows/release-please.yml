name: release-please

# On push to main: open/maintain the Release PR. When that PR is merged
# (release_created = true, the human-sealed gate, RN-15), build and deploy
# production to Vercel. The custom domain is attached only at cutover (see
# docs/runbook.md) — never here. No production deploy on ordinary main merges.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below run only when a Release was just created (Release PR merged).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
        if: ${{ steps.release.outputs.release_created }}

      # Pinned CLI installed outside the project lockfile: its transitive tree would trip the
      # required dependency-review check. Exact version + --ignore-scripts, no on-demand npx.
      - name: Install Vercel CLI
        if: ${{ steps.release.outputs.release_created }}
        run: npm install --global --ignore-scripts vercel@62.2.0

      - name: Deploy production to Vercel
        if: ${{ steps.release.outputs.release_created }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
